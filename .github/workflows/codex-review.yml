name: Codex Review
run-name: "Codex review for PR #${{ github.event.pull_request.number || github.event.issue.number }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: codex-review-pr-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Pull requests (non-draft), an explicit `/codex review` comment from a
    # collaborator on a PR, or a manual dispatch.
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/codex review'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Gate `/codex review` comments to collaborators
        if: github.event_name == 'issue_comment'
        run: |
          set -euo pipefail
          actor="${{ github.event.comment.user.login }}"
          perm="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${actor}/permission" --jq .permission)"
          case "$perm" in admin|maintain|write) ;; *) echo "::notice::$actor ($perm) cannot trigger Codex review"; exit 0 ;; esac

      - name: Resolve PR number, base, head
        id: pr
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "title=${{ github.event.pull_request.title }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            n="${{ github.event.issue.number }}"
            echo "number=$n" >> "$GITHUB_OUTPUT"
            echo "base=$(gh pr view $n --json baseRefName --jq .baseRefName)" >> "$GITHUB_OUTPUT"
            echo "head=$(gh pr view $n --json headRefOid --jq .headRefOid)" >> "$GITHUB_OUTPUT"
            echo "title=$(gh pr view $n --json title --jq .title)" >> "$GITHUB_OUTPUT"
          else
            n="${{ github.event.inputs.pr_number }}"
            echo "number=$n" >> "$GITHUB_OUTPUT"
            echo "base=$(gh pr view $n --json baseRefName --jq .baseRefName)" >> "$GITHUB_OUTPUT"
            echo "head=$(gh pr view $n --json headRefOid --jq .headRefOid)" >> "$GITHUB_OUTPUT"
            echo "title=$(gh pr view $n --json title --jq .title)" >> "$GITHUB_OUTPUT"
          fi

      - name: No secret configured — post a one-time notice and stop
        if: env.OPENAI_API_KEY == ''
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" --body "<!-- codex-review-disabled -->
          ## Codex review is wired but not yet authenticated

          This workflow is ready to run \`codex review\` grounded in Garnet runtime evidence (see \`.codex/skills/code-review-runtime-evidence/SKILL.md\`), but the repository has no \`OPENAI_API_KEY\` secret yet.

          To activate, an org owner either:
          - adds an \`OPENAI_API_KEY\` repository secret, or
          - installs the **Codex GitHub App** on \`garnet-labs/codex\` (chatgpt.com/codex) — the App reads the same \`.codex/skills/\` and posts reviews directly.

          Until then this check is a no-op so it never blocks a PR." || true

      - name: Checkout PR head
        if: env.OPENAI_API_KEY != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Codex CLI
        if: env.OPENAI_API_KEY != ''
        run: curl -fsSL https://chatgpt.com/codex/install.sh | sh

      - name: Run Codex review grounded in Garnet runtime evidence
        if: env.OPENAI_API_KEY != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_REF: ${{ steps.pr.outputs.base }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          {
            echo "<!-- codex-review head=${PR_HEAD} base=${BASE_REF} -->"
            echo
            echo "## Codex review — grounded in Garnet Runtime Review"
            echo
            # Hand the reviewer the PR context the skill needs to fetch evidence.
            export PR_NUMBER BASE_REF PR_HEAD
            # workspace-write lets Codex read the tree and run `gh api` to
            # fetch the Garnet PR comments; it cannot write outside the workspace.
            codex review --base "origin/${BASE_REF}" --title "${PR_TITLE}" \
              -c sandbox_mode=workspace-write \
              - < .codex/prompts/codex-review.md
          } > review.md
          # Fail closed if the required runtime-evidence utterance is absent.
          if ! grep -q "Runtime evidence (Garnet, head" review.md; then
            echo "::warning::Codex review did not emit the required runtime-evidence utterance for head ${PR_HEAD}."
          fi

      - name: Post review to the PR
        if: always() && env.OPENAI_API_KEY != ''
        run: gh pr comment "${{ steps.pr.outputs.number }}" --body-file review.md
